services:
  kiro-rs:
    # 在 Apple Silicon（arm64）上构建/运行 amd64 镜像时需要
    # 也可通过环境变量覆盖：DOCKER_DEFAULT_PLATFORM=linux/amd64
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    image: ianqian1111/kiro-rs:latest
    container_name: kiro-rs
    restart: unless-stopped
    ports:
      - "9000:8990"
    environment:
      # 必填：用于验证 API 请求
      API_KEY: ${API_KEY:?请在项目根目录 .env 或环境变量中设置 API_KEY}
      # 容器内监听地址必须是 0.0.0.0，否则宿主机无法访问
      HOST: 0.0.0.0
      PORT: 8990
      # 将数据库存放到持久化卷中（可选，不配则默认为 data.db）
      DB_PATH: /app/data/data.db
      # 可选：日志级别（info/debug/trace）
      RUST_LOG: ${RUST_LOG:-info}
      # 可选：首次初始化管理员账号
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
    volumes:
      - ./kiro-data:/app/data
